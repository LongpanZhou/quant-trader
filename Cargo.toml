[package]
name = "quant-trader"
version = "0.1.0"
edition = "2021"
description = "Automatic quantitative paper-trading system driven by live US stock data"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
