# Research variant for the website. Not a live preset.
# The same Nasdaq trend rule as the main strategy, but with no volatility
# target: hold TQQQ at full size while QQQ is above its 200-day average.
broker = "sim"
symbols = ["QQQ", "TQQQ", "BIL"]
timeframe = "1d"
poll_seconds = 600

[strategy]
kind = "leveraged_index"
index = "QQQ"
risk_asset = "TQQQ"
leverage = 3.0
safe_asset = "BIL"
sma_days = 200
target_vol = 0.0
vol_days = 20
rebalance_band = 0.05

[risk]
position_pct = 1.0
max_positions = 3
slippage_bps = 1.0

[backtest]
end_date = "2026-11-20"
days = 1824
benchmark = "QQQ"
lag_bars = 1
fill_open = true
