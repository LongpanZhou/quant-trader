# Value + momentum, long-only: hold the 10% of S&P 500 stocks with the best
# combined momentum and cheapness rank (Asness, Moskowitz & Pedersen, 2013).
broker = "sim"
symbols = ["SPY"]
symbols_file = "universes/sp500.csv"
timeframe = "1d"
poll_seconds = 600

[strategy]
kind = "value_momentum"
momentum_days = 252      # one-year return...
momentum_skip = 21       # ...skipping the latest month
value_days = 1260        # five-year decline...
value_skip = 252         # ...skipping the latest year
long_frac = 0.10
short_frac = 0.0
long_gross = 1.0
short_gross = 0.0
rebalance_band = 0.005
index = "SPY"

[risk]
position_pct = 0.10
max_positions = 220
slippage_bps = 1.0
short_borrow_pct = 0.005

[backtest]
days = 1825
