# Opening range breakout on the 3x Nasdaq fund (TQQQ), the instrument the
# paper (Zarattini & Aziz, 2023) reports its best results on. One trade a
# day in the direction of the first 5 minutes; tight stop; flat before the close.
broker = "sim"
symbols = ["TQQQ"]
timeframe = "5m"
poll_seconds = 30

[strategy]
kind = "opening_range"
range_minutes = 5
atr_days = 14
stop_atr = 0.10
target_r = 10.0
risk_pct = 0.01          # a stopped-out trade costs about 1% of the account...
max_weight = 1.0         # the whole account in the one symbol
allow_short = true
flatten_minutes = 3
rebalance_band = 0.25    # one entry per day: never resize an open trade

[risk]
position_pct = 1.0
max_positions = 1
slippage_bps = 1.0
short_borrow_pct = 0.005
flatten_before_close_minutes = 2

[backtest]
days = 28
