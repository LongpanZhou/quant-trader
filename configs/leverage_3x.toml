# Leverage rotation (Gayed & Bilello, 2016): hold the 3x S&P 500 fund (UPRO)
# while SPY closes above its 200-day average, otherwise Treasury bills (BIL).
# UPRO started in 2009, so this test does not include the 2008 crash.
broker = "sim"
symbols = ["SPY", "UPRO", "BIL"]
timeframe = "1d"
poll_seconds = 600

[strategy]
kind = "leveraged_index"
index = "SPY"
risk_asset = "UPRO"
leverage = 3.0
safe_asset = "BIL"
sma_days = 200
target_vol = 0.0          # 0 = full leverage whenever the index is in an uptrend
vol_days = 20
rebalance_band = 0.05

[risk]
position_pct = 1.0
max_positions = 3
slippage_bps = 1.0

[backtest]
days = 6200
