# Long-only variant of configs/ls_momentum.toml (Jegadeesh & Titman, 1993).
# Identical monthly 12-1 ranking, but the short leg is disabled: hold the
# strongest 10% of the S&P 500 at 100% of equity, in cash otherwise.
broker = "sim"
symbols = ["SPY"]
symbols_file = "universes/sp500.csv"
timeframe = "1d"
poll_seconds = 600

[strategy]
kind = "ls_momentum"
lookback_days = 252
skip_days = 21
long_frac = 0.10
short_frac = 0.0
long_gross = 1.0
short_gross = 0.0
rebalance_band = 0.005
index = "SPY"

[risk]
position_pct = 0.10
max_positions = 120
slippage_bps = 1.0
short_borrow_pct = 0.0

[backtest]
days = 1825
