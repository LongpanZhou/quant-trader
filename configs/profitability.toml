# Profitability, long/short: long the 20% of S&P 500 companies with the
# highest return on assets, short the 20% with the lowest (Novy-Marx, 2013).
broker = "sim"
symbols = ["SPY"]
symbols_file = "universes/sp500.csv"
timeframe = "1d"
poll_seconds = 600

[strategy]
kind = "profitability"
long_frac = 0.20
short_frac = 0.20
long_gross = 1.0
short_gross = 0.5
rebalance_band = 0.005
index = "SPY"

[risk]
position_pct = 0.10
max_positions = 220
slippage_bps = 1.0
short_borrow_pct = 0.005

[backtest]
days = 1825
