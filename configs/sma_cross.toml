# Trend following: fast/slow moving-average crossover on 5-minute bars.
broker = "sim"
symbols = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "TSLA", "SPY"]
timeframe = "5m"
poll_seconds = 30

[strategy]
kind = "sma_cross"
fast = 10
slow = 30

[risk]
position_pct = 0.10
max_positions = 5
stop_loss_pct = 0.02
take_profit_pct = 0.04
slippage_bps = 1.0

[backtest]
days = 30
