# Earnings surprise: reads each S&P 500 company's quarterly report from SEC
# EDGAR when it is filed and trades the next day. Aggressive sizing: 20% of
# equity per position, long after a strongly positive profit surprise, short
# after a strongly negative one, held for 30 days.
broker = "sim"
symbols = ["SPY"]
symbols_file = "universes/sp500.csv"
timeframe = "1d"
poll_seconds = 600

[strategy]
kind = "earnings_drift"
long_sue = 2.0
short_sue = -2.0
hold_days = 30
position_weight = 0.20
max_long = 1.0
max_short = 0.6
rebalance_band = 0.05

[risk]
position_pct = 0.10
max_positions = 10
slippage_bps = 1.0
short_borrow_pct = 0.005

[backtest]
days = 1825
