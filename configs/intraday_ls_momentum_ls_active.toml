# ACTIVE version of intraday_ls_momentum_ls.toml: the same momentum ranking, but re-ranked
# every 30 minutes on prices that include today's move, so holdings change
# through the day instead of once near the close.
#
# Intraday long/short cross-sectional momentum: the same ranking as
# configs/ls_momentum.toml, but the score is measured over the last 20 trading
# days of 5-minute bars and the book is rebalanced once a day, shortly before
# the close. Positions are held overnight.
#
# 5-minute bars are used because Yahoo keeps only ~30 days of 1-minute history,
# which cannot hold the 20-day warm-up plus a month-long test.
broker = "sim"
symbols = ["SPY"]
symbols_file = "universes/sp500.csv"
timeframe = "5m"
poll_seconds = 30

[strategy]
kind = "intraday_ls_momentum"
lookback_days = 20
skip_days = 0            # count the latest price, including today
long_frac = 0.10
short_frac = 0.10
long_gross = 1.0
short_gross = 0.5
rebalance_band = 0.02      # do not resize a holding for small drifts
rebalance_minutes = 30     # re-rank every 30 minutes (0 = once a day)
index = "SPY"

[risk]
position_pct = 0.10
max_positions = 120
slippage_bps = 1.0
short_borrow_pct = 0.005

[backtest]
days = 28
