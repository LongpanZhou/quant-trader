# Volatility-sized trend following across the whole S&P 500: holds up to 40
# of the strongest trending stocks, unused capital parked in SPY.
broker = "sim"
symbols = ["SPY"]
symbols_file = "universes/sp500_100.csv"
timeframe = "1d"
poll_seconds = 600

[strategy]
kind = "trend_vol_target"
entry_lookback = 20
exit_lookback = 40
keltner_mult = 2.0
vol_days = 14
position_vol_target = 0.02
max_weight = 0.05
max_gross = 1.0
rebalance_band = 0.01
index = "SPY"
index_sma = 200
park_cash_in_index = true
max_names = 40

[risk]
position_pct = 0.05
max_positions = 60
slippage_bps = 1.0

[backtest]
benchmark = "SPY"
lag_bars = 1
fill_open = true
days = 1825

