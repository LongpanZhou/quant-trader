# 20-year test vehicle: QLD (2x Nasdaq, real prices since June 2006) replaces
# TQQQ, which only launched in February 2010. Same rule and vol target.
broker = "sim"
symbols = ["QQQ", "QLD", "BIL"]
timeframe = "1d"
poll_seconds = 600

[strategy]
kind = "leveraged_index"
index = "QQQ"
risk_asset = "QLD"
leverage = 2.0
safe_asset = "BIL"
sma_days = 165
target_vol = 0.40
vol_days = 20
rebalance_band = 0.05

[risk]
position_pct = 1.0
max_positions = 3
slippage_bps = 1.0

[backtest]
days = 7300
benchmark = "QQQ"


lag_bars = 1
fill_open = true

