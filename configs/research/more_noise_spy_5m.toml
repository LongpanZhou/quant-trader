# Zarattini, Aziz & Barbon (2024) "Beat the Market": SPY intraday momentum.
# Long above / short below the noise area around the open, exit when price
# crosses back through the band or the VWAP, flat before the close.
# Size = 2% daily volatility target / SPY's recent daily volatility, capped at
# 1x. Five-year test on 5-minute candles (needs: download-history.ps1 once;
# SPY is already cached).
broker = "sim"
history = "dukascopy"
symbols = ["SPY"]
timeframe = "5m"
poll_seconds = 30

[strategy]
kind = "noise_area"
lookback_days = 14
vol_days = 14
check_minutes = 30
target_daily_vol = 0.02
max_weight = 1.0
allow_short = true
flatten_minutes = 5
rebalance_band = 0.15

[risk]
position_pct = 1.0
max_positions = 2
slippage_bps = 1.0
max_leverage = 1.0
margin_rate_pct = 0.06
flatten_before_close_minutes = 3

[backtest]
benchmark = "SPY"
days = 1825

