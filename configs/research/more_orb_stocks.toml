# Opening range breakout on "stocks in play" (Zarattini, Barbon & Aziz, 2024,
# "A Profitable Day Trading Strategy For The U.S. Equity Market").
# Watches about 100 S&P 500 stocks. After the first 5 minutes it keeps the 20
# with the most unusual opening volume and trades each in the direction it
# opened: stop at 10% of its average daily range, out before the close.
broker = "sim"
symbols_file = "universes/sp500_100.csv"
timeframe = "5m"
poll_seconds = 20

[strategy]
kind = "opening_range"
range_minutes = 5
atr_days = 14
stop_atr = 0.10
target_r = 10.0
risk_pct = 0.01
max_weight = 0.05        # 5% of the account per stock, so 20 stocks = no leverage
allow_short = true
flatten_minutes = 5
rebalance_band = 0.25    # one entry per day: never resize an open trade
top_n = 20               # the 20 stocks with the highest relative opening volume
min_rel_volume = 1.0     # opening volume at least its own normal
min_price = 5.0
min_atr = 0.50

[risk]
position_pct = 0.05
max_positions = 25
slippage_bps = 1.0
short_borrow_pct = 0.005
flatten_before_close_minutes = 2

[backtest]
benchmark = "SPY"
days = 28

