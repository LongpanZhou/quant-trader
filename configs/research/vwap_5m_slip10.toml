# VWAP trend on 5-minute candles (Zarattini & Aziz, 2023).
# After every completed minute: long if the close is above the session VWAP,
# short if it is below. Flat before the close; nothing is held overnight.
broker = "sim"
symbols = ["QQQ", "SPY"]
timeframe = "5m"
poll_seconds = 30

[strategy]
kind = "vwap_trend"
position_weight = 0.5    # half the account in each symbol
allow_short = true
flatten_minutes = 3      # be flat for the last 3 minutes of the session
rebalance_band = 0.10    # do not resize a position just because prices drifted

[risk]
position_pct = 0.5
max_positions = 2
stop_loss_pct = 0.0
take_profit_pct = 0.0
slippage_bps = 10
short_borrow_pct = 0.005
flatten_before_close_minutes = 2   # safety net: also correct on half-days

[backtest]
days = 28

