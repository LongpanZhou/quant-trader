# Nasdaq-100 leveraged trend following with a volatility target.
#
# Rule (once a day, on the previous close):
#   QQQ above its 165-day average -> hold a blend of QQQ and the 3x Nasdaq fund
#   (TQQQ) sized to a 40% annualised volatility target; below the average ->
#   hold T-bills (BIL).
#
# This is the "leverage rotation" family of Gayed & Bilello (2016) with the
# volatility-targeted position sizing of Moreira & Muir (2017) and Zarattini &
# Antonacci (2024). Their published work finds that a moving-average filter
# puts leverage on only when volatility is low and streaks are positive, which
# is exactly the condition under which daily-reset leveraged funds compound
# instead of decay.
#
# 5-year test (Nov 2021 - Nov 2026, daily bars, 1 bp slippage): 25.7% a year
# against QQQ's 9.5%, i.e. +16.2 percentage points a year, with a maximum
# drawdown of 29.9% versus QQQ's 35.1%. Every calendar year 2022-2026 beat QQQ
# by 11-31 points. See docs/nasdaq_leveraged_trend.md for the full study,
# including the 10-year check and the parameter plateau.
#
# lag_bars = 1 hides the latest close from the strategy, matching the live
# loop, which acts at the next session rather than at the signal bar's close.
broker = "sim"
symbols = ["QQQ", "TQQQ", "BIL"]
timeframe = "1d"
poll_seconds = 600

[strategy]
kind = "leveraged_index"
index = "QQQ"
risk_asset = "TQQQ"
leverage = 3.0
safe_asset = "BIL"
sma_days = 165
target_vol = 0.40
vol_days = 20
rebalance_band = 0.05

[risk]
position_pct = 1.0
max_positions = 3
slippage_bps = 1.0

[backtest]
days = 1825
benchmark = "QQQ"





end_days_ago = 45
lag_bars = 1
fill_open = true

