# Three strategies on one account, S&P 500 universe:
#   50%  volatility-sized trend following (up to 30 names)
#   30%  long/short momentum (long top 10%, short bottom 10%)
#   20%  Connors RSI(2) pullbacks (up to 10 positions)
# Target weights are added up per symbol; longs are capped at 100% of the
# account and shorts at 30%.
broker = "sim"
symbols = ["SPY"]
symbols_file = "universes/sp500.csv"
timeframe = "1d"
poll_seconds = 600

[strategy]
kind = "combo"
rebalance_band = 0.005
max_long = 1.0
max_short = 0.3

[[strategy.parts]]
allocation = 0.5
[strategy.parts.strategy]
kind = "trend_vol_target"
entry_lookback = 20
exit_lookback = 40
keltner_mult = 2.0
vol_days = 14
position_vol_target = 0.02
max_weight = 0.10
max_gross = 1.0
rebalance_band = 0.01
index = "SPY"
index_sma = 200
park_cash_in_index = false
max_names = 30

[[strategy.parts]]
allocation = 0.3
[strategy.parts.strategy]
kind = "ls_momentum"
lookback_days = 252
skip_days = 21
long_frac = 0.10
short_frac = 0.10
long_gross = 1.0
short_gross = 1.0
rebalance_band = 0.005
index = "SPY"

[[strategy.parts]]
allocation = 0.2
position_pct = 0.10
max_positions = 10
[strategy.parts.strategy]
kind = "connors_rsi2"
rsi_period = 2
entry_below = 5.0
trend_sma = 200
exit_sma = 5

[risk]
position_pct = 0.05
max_positions = 200
slippage_bps = 1.0
short_borrow_pct = 0.005

[backtest]
days = 1825
