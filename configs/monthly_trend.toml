# Faber (2007), "A Quantitative Approach to Tactical Asset Allocation".
# Five asset classes (US stocks, foreign stocks, bonds, real estate,
# commodities), 20% each; hold each one only while its last month-end close
# is above its 10-month average, otherwise sit in cash.
broker = "sim"
symbols = ["SPY", "EFA", "IEF", "VNQ", "DBC"]
timeframe = "1d"
poll_seconds = 300

[strategy]
kind = "monthly_trend"
months = 10

[risk]
position_pct = 0.20
max_positions = 5
stop_loss_pct = 0.0
take_profit_pct = 0.0
slippage_bps = 1.0

[backtest]
days = 3650
