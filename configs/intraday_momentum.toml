# Zarattini, Aziz & Barbon (2024), "Beat the Market: An Effective Intraday
# Momentum Strategy for S&P500 ETF (SPY)" - long side only, no leverage.
# Buys when price breaks out of its usual intraday range ("noise area"),
# trails a stop at max(range edge, VWAP), and is always flat before the close.
broker = "sim"
symbols = ["SPY", "QQQ"]
timeframe = "5m"
poll_seconds = 30

[strategy]
kind = "intraday_momentum"
lookback_days = 14     # sessions used to measure the normal intraday range
check_minutes = 30     # entries only at :00 and :30, as in the paper

[risk]
position_pct = 0.50
max_positions = 2
stop_loss_pct = 0.0    # the strategy has its own trailing stop
take_profit_pct = 0.0
slippage_bps = 1.0

[backtest]
days = 35              # Yahoo only serves ~59 days of 5-minute history
