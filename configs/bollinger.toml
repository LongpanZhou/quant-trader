# Chan (2013), "Algorithmic Trading" - Bollinger-band mean reversion, long
# side only. Daily bars: buy 2 standard deviations below the 20-day average,
# sell when price is back at the average.
broker = "sim"
symbols = ["AAPL","MSFT","NVDA","AMZN","GOOGL","META","TSLA","AVGO","JPM","V","MA","UNH","XOM","JNJ","PG","HD","COST","ABBV","MRK","KO","PEP","WMT","BAC","CVX","LLY","ORCL","CRM","ADBE","NFLX","AMD","CSCO","INTC","DIS","MCD","NKE","CAT","BA","GE","IBM","QCOM"]
timeframe = "1d"
poll_seconds = 300

[strategy]
kind = "bollinger"
lookback = 20
entry_z = 2.0
exit_z = 0.0

[risk]
position_pct = 0.10
max_positions = 10
stop_loss_pct = 0.0
take_profit_pct = 0.0
slippage_bps = 1.0

[backtest]
days = 1825
