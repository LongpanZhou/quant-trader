# Leverage rotation (Gayed & Bilello, 2016): hold the 2x S&P 500 fund (SSO)
# while SPY closes above its 200-day average, otherwise short-term
# Treasuries (SHY). Tested from 2006, so it includes the 2008 crash.
broker = "sim"
symbols = ["SPY", "SSO", "SHY"]
timeframe = "1d"
poll_seconds = 600

[strategy]
kind = "leveraged_index"
index = "SPY"
risk_asset = "SSO"
leverage = 2.0
safe_asset = "SHY"
sma_days = 200
target_vol = 0.0          # 0 = full leverage whenever the index is in an uptrend
vol_days = 20
rebalance_band = 0.05

[risk]
position_pct = 1.0
max_positions = 3
slippage_bps = 1.0

[backtest]
days = 7300
