# Leverage rotation on the Nasdaq 100: hold the 3x fund (TQQQ) while QQQ
# closes above its 200-day average, otherwise Treasury bills (BIL).
broker = "sim"
symbols = ["QQQ", "TQQQ", "BIL", "SPY"]
timeframe = "1d"
poll_seconds = 600

[strategy]
kind = "leveraged_index"
index = "QQQ"
risk_asset = "TQQQ"
leverage = 3.0
safe_asset = "BIL"
sma_days = 200
target_vol = 0.0          # 0 = full leverage whenever the index is in an uptrend
vol_days = 20
rebalance_band = 0.05

[risk]
position_pct = 1.0
max_positions = 4
slippage_bps = 1.0

[backtest]
days = 6000
