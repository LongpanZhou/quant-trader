# Leverage rotation on 5-minute candles: 3x S&P 500 fund (UPRO) while SPY is
# above its average, otherwise Treasury bills (BIL).
# 5-minute candles: the trend is checked after every candle against the
# average of the last 20 trading days of 5-minute closes. (A 200-day average
# is not possible here: only about 59 days of 5-minute history exist.)
broker = "sim"
symbols = ["SPY", "UPRO", "BIL"]
timeframe = "5m"
poll_seconds = 60

[strategy]
kind = "leveraged_index"
index = "SPY"
risk_asset = "UPRO"
leverage = 3.0
safe_asset = "BIL"
sma_days = 20
target_vol = 0.0
vol_days = 5
rebalance_band = 0.05

[risk]
position_pct = 1.0
max_positions = 4
slippage_bps = 1.0

[backtest]
days = 28
